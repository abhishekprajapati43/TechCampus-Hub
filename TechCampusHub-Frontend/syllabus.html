<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Syllabus | TechCampus_Hub</title>
        <meta name="description" content="TechCampus_Hub - Browse the course syllabus for BCA, MCA and B.Tech by semester.">
        <meta name="theme-color" content="#102a56">
        <link rel="icon" type="image/png" href="./assets/logo.png">
        <link rel="apple-touch-icon" href="./assets/logo.png">
        <!-- =====================================================
         TAILWIND CSS
    ====================================================== -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- =====================================================
         FONT AWESOME
    ====================================================== -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <!-- =====================================================
         TAILWIND CONFIG
    ====================================================== -->
        <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: "#102a56",
                        bluehub: "#2563eb",
                        softbg: "#f5f8fc"
                    },

                    boxShadow: {
                        soft: "0 8px 28px rgba(15,39,74,.08)"
                    }
                }
            }
        };
        </script>
        <!-- =====================================================
         CUSTOM CSS
    ====================================================== -->
        <link rel="stylesheet" href="style.css">
    </head>
<body data-page="syllabus">
        <div id="dashboardSection" class="min-h-screen">
            <div id="pageChrome"></div>
                <!-- =====================================================
         MAIN AREA
    ====================================================== -->
                <main class="main-area
               md:ml-64
               min-h-screen">
                    <div id="pageHeader"></div>
                    <!-- =================================================
             PAGE CONTENT
        ================================================== -->
                    <div class="p-5
                   md:p-8
                   max-w-[1500px]
                   mx-auto">
                        <!-- ================= SYLLABUS ================= -->
                        <section class="card p-6 mb-5">
                            <div class="flex flex-col md:flex-row md:items-center
                                        md:justify-between gap-4 mb-6">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-xl
                                                bg-rose-50 text-rose-600
                                                flex items-center justify-center
                                                text-xl shrink-0">
                                        <i class="fa-solid fa-book-open-reader"></i>
                                    </div>
                                    <div>
                                        <h2 class="text-xl font-extrabold">
                                            Syllabus
                                        </h2>
                                        <p class="text-sm text-slate-500">
                                            Choose your course and semester to open the syllabus PDF.
                                        </p>
                                    </div>
                                </div>
                                <span class="inline-flex items-center gap-2 rounded-xl
                                             bg-slate-100 px-4 py-2 text-xs font-semibold
                                             text-slate-600">
                                    <i class="fa-solid fa-lock"></i>
                                    View only · Secure PDF viewer
                                </span>
                            </div>

                            <p id="syllabusMessage" class="hidden" aria-live="polite"></p>

                            <!-- Course tabs -->
                            <div class="mb-3">
                                <p class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">
                                    Course
                                </p>
                                <div id="syllabusProgramTabs" class="flex flex-wrap gap-2">
                                    <button type="button"
                                            data-syllabus-program="BCA"
                                            class="rounded-xl border border-slate-200
                                                   bg-white px-4 py-2.5 text-sm font-bold
                                                   text-slate-600 transition
                                                   hover:bg-slate-50">
                                        BCA
                                    </button>
                                    <button type="button"
                                            data-syllabus-program="MCA"
                                            class="rounded-xl border border-slate-200
                                                   bg-white px-4 py-2.5 text-sm font-bold
                                                   text-slate-600 transition
                                                   hover:bg-slate-50">
                                        MCA
                                    </button>
                                    <button type="button"
                                            data-syllabus-program="B.Tech"
                                            class="rounded-xl border border-slate-200
                                                   bg-white px-4 py-2.5 text-sm font-bold
                                                   text-slate-600 transition
                                                   hover:bg-slate-50">
                                        B.Tech
                                    </button>
                                </div>
                            </div>

                            <!-- Semester pills -->
                            <div class="mb-5">
                                <p class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-2">
                                    Semester
                                </p>
                                <div id="syllabusSemesterPills" class="flex flex-wrap gap-2"></div>
                            </div>

                            <div class="flex flex-wrap items-center justify-between gap-3
                                        border-t border-slate-100 pt-4 mb-4">
                                <p id="syllabusResultCount" class="text-sm font-semibold text-slate-600">
                                    Loading…
                                </p>
                                <p class="text-xs text-slate-400">
                                    PDFs open in the secure viewer — download and print are disabled.
                                </p>
                            </div>

                            <div id="syllabusList" class="grid
               grid-cols-1
               md:grid-cols-2
               xl:grid-cols-3
               gap-4">
                                <div class="col-span-full py-12 text-center text-slate-500">
                                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                                    <p class="font-semibold">
                                        Loading syllabus…
                                    </p>
                                </div>
                            </div>
                        </section>
                    </div>
                </main>
            </div>
        <script src="./js/env.js"></script>
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
